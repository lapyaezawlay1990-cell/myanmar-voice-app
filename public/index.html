<!doctype html>
<html lang="my">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>မြန်မာအသံ</title></head>
<body style="font-family:Arial,sans-serif;max-width:650px;margin:30px auto;padding:20px;background:#f5f5f5"><main style="background:white;padding:20px;border-radius:15px"><h1>မြန်မာအသံ</h1><p>ဗီဒီယိုကို မြန်မာဘာသာပြန်ရန်</p><input id="video" type="file" accept="video/*"><p><select id="voice"><option value="female">မိန်းကလေးအသံ</option><option value="male">ယောက်ျားလေးအသံ</option></select></p><button onclick="go()">ဘာသာပြန်မယ်</button><p><textarea id="result" style="width:100%;height:140px" placeholder="ဘာသာပြန်စာသား"></textarea></p><button onclick="navigator.clipboard.writeText(document.getElementById('result').value)">စာသားကူးမယ်</button><p id="status">ဗီဒီယိုရွေးပြီး စတင်ပါ။</p></main><script>async function go(){let f=document.getElementById("video").files[0];if(!f){alert("ဗီဒီယိုရွေးပါ");return}let d=new FormData();d.append("video",f);d.append("voice",document.getElementById("voice").value==="male"?"male":"female");let s=document.getElementById("status");s.textContent="လုပ်ဆောင်နေသည်...";try{let r=await fetch("/api/process",{method:"POST",body:d});let j=await r.json();if(!r.ok)throw Error(j.error||"အမှား");document.getElementById("result").value=j.burmeseText||"";s.textContent="ပြီးပါပြီ"}catch(e){s.textContent="အမှား: "+e.message}}</script></body></html>
